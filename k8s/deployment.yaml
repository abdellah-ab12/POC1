apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplegreetingapi
  namespace: poc3
  labels:
    app: simplegreetingapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplegreetingapi
  template:
    metadata:
      labels:
        app: simplegreetingapi
    spec:
      containers:
        - name: simplegreetingapi
          image: 192.168.88.143/poc1/simplegreetingapi:24
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      imagePullSecrets:
        - name: harbor-registry-secret
