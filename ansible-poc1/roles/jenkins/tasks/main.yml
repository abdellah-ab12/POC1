---
- name: Créer le volume Docker pour Jenkins (persistance des données)
  command: docker volume create {{ jenkins_volume }}
  become: true
  register: jenkins_volume_result
  changed_when: "'already exists' not in jenkins_volume_result.stderr"
  failed_when: false

- name: Vérifier si le conteneur Jenkins existe déjà
  shell: "docker ps -a --filter name=^{{ jenkins_container_name }}$ --format '{{ '{{.Names}}' }}'"
  register: jenkins_container_check
  changed_when: false
  become: true

- name: Lancer le conteneur Jenkins
  command: >
    docker run -d
    --name {{ jenkins_container_name }}
    -p {{ jenkins_http_port }}:8080
    -p {{ jenkins_agent_port }}:50000
    -v {{ jenkins_volume }}:/var/jenkins_home
    -v /var/run/docker.sock:/var/run/docker.sock
    --restart unless-stopped
    jenkins/jenkins:lts
  become: true
  when: jenkins_container_check.stdout == ""

- name: Attendre que Jenkins soit prêt (fichier de mot de passe généré)
  wait_for:
    path: /var/lib/docker/volumes/{{ jenkins_volume }}/_data/secrets/initialAdminPassword
    timeout: 120
  become: true

- name: Récupérer le mot de passe administrateur initial
  command: docker exec {{ jenkins_container_name }} cat /var/jenkins_home/secrets/initialAdminPassword
  register: jenkins_admin_password
  become: true
  changed_when: false

- name: Afficher le mot de passe administrateur initial de Jenkins
  debug:
    msg: "Mot de passe admin Jenkins : {{ jenkins_admin_password.stdout }}"
